<!DOCTYPE html>
<html>
    <head>
        <title>Portfólio de Imagem</title>
    </head>
    <body>
        <header>
            <h1>Meu Portfólio de Imagens</h1>
        </header>
        <main>
            <section>
                <h2>Fotos do Batman</h2>
                <figure>
                    <img src="img/bat1.jpeg"
                        alt="Imagem do Batman"
                        width="200">
                    <figcaption>
                        Batman 1
                    </figcaption>
                </figure>

                <figure>
                    <img src="img/bat2.jpeg"
                        alt="Imagem do Batman 2"
                        width="200">
                    <figcaption>
                        Batman 2
                    </figcaption>
                </figure>

                <figure>
                    <img src="img/bat3.jpeg"
                        alt="Imagem do Batman 3"
                        width="200">
                    <figcaption>
                        Batman 3
                    </figcaption>
                </figure>
            </section>
        </main>
        <footer>
            <p>2026 - Meu Portfólio</p>
        </footer>
    </body>
</html>
